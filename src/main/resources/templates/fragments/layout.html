<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - 我的博客'">我的博客</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- CSRF token：供 Ajax 调用 /api/** 时放进请求头（Spring Security CSRF 开启） -->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
    <style>
        /* 移动端适配：正文内的图片/表格不撑破布局 */
        .article-content img { max-width: 100%; height: auto; }
        .article-content table { width: 100%; display: block; overflow-x: auto; }
        .article-content pre { overflow-x: auto; }
    </style>
</head>
<body>

<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">我的博客</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">首页</a>
            <a class="nav-link" th:href="@{/hot}">热门</a>
            <a class="nav-link" th:href="@{/archives}">归档</a>
            <a class="nav-link" th:if="${isAdmin}" th:href="@{/admin}">后台</a>
            <a class="nav-link" th:if="${!isLoggedIn}" th:href="@{/login}">登录</a>
            <a class="nav-link" th:if="${!isLoggedIn}" th:href="@{/register}">注册</a>
            <span class="nav-link" th:if="${isLoggedIn}" th:text="${currentUsername}"></span>
            <form th:if="${isLoggedIn}" th:action="@{/logout}" method="post" class="d-flex align-items-center">
                <button type="submit" class="btn btn-outline-light btn-sm">登出</button>
            </form>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="border-top py-4 mt-5 text-muted">
    <div class="container small">基于 Spring Boot 4 + Thymeleaf 构建</div>
</footer>

</body>
</html>
