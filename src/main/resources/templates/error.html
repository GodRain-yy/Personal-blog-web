<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${code} + ' - 我的博客'">出错了</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">我的博客</a>
    </div>
</nav>

<div class="container py-5 text-center">
    <div class="display-1 fw-bold text-secondary" th:text="${code}">404</div>
    <p class="lead mt-3" th:switch="${code}">
        <span th:case="404">抱歉，你访问的页面不存在或已被删除。</span>
        <span th:case="403">你没有权限访问这个页面。</span>
        <span th:case="401">请先登录后再访问。</span>
        <span th:case="*">服务器开小差了，请稍后再试。</span>
    </p>
    <p th:if="${message != null and message != ''}" class="text-muted small" th:text="${message}"></p>
    <a th:href="@{/}" class="btn btn-primary mt-3">返回首页</a>
</div>
</body>
</html>
