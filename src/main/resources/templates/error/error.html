<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'错误 ' + ${code}">错误</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container" style="max-width: 520px; padding-top: 100px; text-align: center;">
    <h1 class="display-4" th:text="${code}">500</h1>
    <p class="text-muted" th:text="${message}">出错了</p>
    <a href="/" class="btn btn-outline-primary mt-3">返回首页</a>
</div>
</body>
</html>
