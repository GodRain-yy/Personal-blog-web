<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">博客后台</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" th:href="@{/admin/article}">文章管理</a>
            <a class="nav-link" th:href="@{/admin/category}">分类管理</a>
            <a class="nav-link" th:href="@{/admin/tag}">标签管理</a>
            <a class="nav-link" th:href="@{/}">前台</a>
        </div>
        <div class="d-flex align-items-center text-light gap-3 ms-auto">
            <span th:text="'你好，' + ${loginUser.displayName}"></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-light">退出</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row g-3">
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-subtitle text-muted">用户总数</h6>
                    <h2 class="mt-2 mb-0" th:text="${userCount}">0</h2>
                    <a th:href="@{/admin/user}" target="_blank" class="btn btn-outline-primary btn-sm mt-2">查看用户</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-subtitle text-muted">文章总数</h6>
                    <h2 class="mt-2 mb-0" th:text="${articleCount != null} ? ${articleCount} : 0">0</h2>
                    <a th:href="@{/admin/article}" class="small">去管理</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-subtitle text-muted">分类 / 标签</h6>
                    <h2 class="mt-2 mb-0">
                        <span th:text="${categoryCount != null} ? ${categoryCount} : 0">0</span>
                        <span class="text-muted">/</span>
                        <span th:text="${tagCount != null} ? ${tagCount} : 0">0</span>
                    </h2>
                    <a th:href="@{/admin/category}" class="small">去管理</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-subtitle text-muted">评论总数</h6>
                    <h2 class="mt-2 mb-0" th:text="${commentCount != null} ? ${commentCount} : 0">0</h2>
                    <small class="text-muted">D5 已接入</small>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">返回前台</a>
    </div>
</div>
</body>
</html>
