<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('文章管理')}"></head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">博客后台</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/admin/article}">文章管理</a>
            <a class="nav-link" th:href="@{/admin}">概览</a>
            <a class="nav-link" th:href="@{/}">前台</a>
        </div>
        <form th:action="@{/logout}" method="post" class="ms-auto">
            <button type="submit" class="btn btn-sm btn-outline-light">退出</button>
        </form>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">文章列表</h4>
        <a th:href="@{/admin/article/edit}" class="btn btn-primary btn-sm">写文章</a>
    </div>

    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

    <table class="table table-hover align-middle">
        <thead>
        <tr>
            <th>标题</th>
            <th>分类</th>
            <th>状态</th>
            <th>浏览</th>
            <th>发布时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(pageResult.records)}">
            <td colspan="6" class="text-center text-muted">暂无文章</td>
        </tr>
        <tr th:each="a : ${pageResult.records}">
            <td th:text="${a.title}"></td>
            <td th:text="${a.categoryName != null} ? ${a.categoryName} : '-'"></td>
            <td>
                <span th:if="${a.publishTime != null}" class="badge bg-success">已发布</span>
                <span th:unless="${a.publishTime != null}" class="badge bg-secondary">草稿</span>
            </td>
            <td th:text="${a.viewCount}"></td>
            <td th:text="${a.publishTime != null} ? ${#temporals.format(a.publishTime, 'yyyy-MM-dd HH:mm')} : '-'"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/admin/article/edit(id=${a.id})}">编辑</a>
                <form th:action="@{/admin/article/delete}" method="post" class="d-inline"
                      onsubmit="return confirm('确定删除这篇文章？');">
                    <input type="hidden" name="id" th:value="${a.id}">
                    <button type="submit" class="btn btn-sm btn-outline-danger">删除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${pageResult.pages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${pageResult.page le 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/article(page=${pageResult.page - 1})}">上一页</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="'第 ' + ${pageResult.page} + ' / ' + ${pageResult.pages} + ' 页'"></span>
            </li>
            <li class="page-item" th:classappend="${pageResult.page ge pageResult.pages} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/article(page=${pageResult.page + 1})}">下一页</a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
