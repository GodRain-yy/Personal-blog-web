<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户管理 - 博客后台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">博客后台</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" th:href="@{/admin/article}">文章管理</a>
            <a class="nav-link" th:href="@{/admin/category}">分类管理</a>
            <a class="nav-link" th:href="@{/admin/tag}">标签管理</a>
            <a class="nav-link active" th:href="@{/admin/user}">用户管理</a>
            <a class="nav-link" th:href="@{/}">前台</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h4 class="mb-3">已注册用户</h4>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>昵称</th>
                <th>邮箱</th>
                <th>角色</th>
                <th>状态</th>
                <th>注册时间</th>
                <th>最后登录</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.username}">user</td>
                <td th:text="${u.nickname}">昵称</td>
                <td th:text="${u.email}">email</td>
                <td>
                    <span th:if="${u.role == 1}" class="badge bg-danger">管理员</span>
                    <span th:unless="${u.role == 1}" class="badge bg-secondary">普通用户</span>
                </td>
                <td>
                    <span th:if="${u.status == 1}" class="badge bg-success">正常</span>
                    <span th:unless="${u.status == 1}" class="badge bg-warning text-dark">禁用</span>
                </td>
                <td th:text="${u.createTime != null} ? ${#temporals.format(u.createTime, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                <td th:text="${u.lastLoginAt != null} ? ${#temporals.format(u.lastLoginAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="8" class="text-center text-muted py-4">暂无注册用户</td>
            </tr>
            </tbody>
        </table>
    </div>
    <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">返回概览</a>
</div>
</body>
</html>
