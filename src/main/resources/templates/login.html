<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; padding-top: 80px;">
    <h3 class="mb-4">登录</h3>

    <div th:if="${param.error}" class="alert alert-danger">用户名或密码错误</div>
    <div th:if="${param.logout}" class="alert alert-success">已退出登录</div>
    <div th:if="${param.registered}" class="alert alert-success">注册成功，请登录</div>

    <!-- th:action 会自动注入 CSRF token，不要写成 action="/login" -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="remember-me" id="remember-me">
            <label class="form-check-label" for="remember-me">记住我（7 天）</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">登录</button>
    </form>
    <div class="mt-3 d-flex justify-content-between">
        <a th:href="@{/register}">还没有账号？立即注册</a>
        <a th:href="@{/}">返回首页</a>
    </div>
</div>
</body>
</html>
