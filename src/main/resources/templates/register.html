<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container" style="max-width: 460px; padding-top: 70px;">
    <h3 class="mb-4">注册</h3>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" th:field="*{username}" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">邮箱</label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">昵称（选填）</label>
            <input type="text" th:field="*{nickname}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" th:field="*{password}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">注册</button>
    </form>

    <div class="mt-3 d-flex justify-content-between">
        <a th:href="@{/login}">已有账号？登录</a>
        <a th:href="@{/}">返回首页</a>
    </div>
</div>
</body>
</html>
