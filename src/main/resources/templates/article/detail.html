<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${article.title})}"></head>
<body>

<div th:replace="~{fragments/layout :: nav}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <article class="card">
                <div class="card-body">
                    <h1 class="card-title mb-3" th:text="${article.title}"></h1>
                    <p class="text-muted small">
                        <span th:if="${article.publishTime != null}"
                              th:text="${#temporals.format(article.publishTime, 'yyyy-MM-dd HH:mm')}"></span>
                        <span th:if="${article.categoryName != null}" th:text="' · ' + ${article.categoryName}"></span>
                        <span th:text="' · ' + ${article.viewCount} + ' 次浏览'"></span>
                    </p>

                    <div th:unless="${#lists.isEmpty(article.tagList)}" class="mb-3">
                        <span th:each="t : ${article.tagList}" class="badge bg-secondary me-1" th:text="${t}"></span>
                    </div>

                    <hr>

                    <!-- contentHtml 已在服务端渲染时过 OWASP 白名单，可安全 utext 输出 -->
                    <div class="article-content" th:utext="${article.contentHtml}"></div>

                    <!-- 点赞 / 收藏 -->
                    <div class="d-flex align-items-center gap-2 mt-4 article-actions">
                        <button type="button" id="likeBtn"
                                class="btn btn-sm"
                                th:classappend="${liked} ? 'btn-danger' : 'btn-outline-danger'"
                                th:disabled="${currentUserId == null}">
                            <span id="likeIcon">♥</span> 点赞
                            <span id="likeCount" class="badge bg-light text-dark" th:text="${article.likeCount} ?: 0"></span>
                        </button>
                        <button type="button" id="favBtn"
                                class="btn btn-sm"
                                th:classappend="${favorited} ? 'btn-warning' : 'btn-outline-warning'"
                                th:disabled="${currentUserId == null}">
                            <span id="favIcon">★</span> 收藏
                        </button>
                        <span th:if="${currentUserId == null}" class="text-muted small">
                            <a th:href="@{/login}">登录</a> 后可点赞收藏
                        </span>
                    </div>
                </div>
            </article>

            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm mt-3">返回列表</a>

            <!-- 评论区 -->
            <div class="card mt-4" id="comments">
                <div class="card-body">
                    <h5 class="card-title mb-3">
                        评论 <span class="text-muted small" th:text="'(' + ${#lists.size(comments)} + ')'"></span>
                    </h5>

                    <div th:if="${commentError}" class="alert alert-warning py-2" th:text="${commentError}"></div>

                    <form th:if="${currentUserId != null}" th:action="@{/comments}" method="post" class="mb-4">
                        <input type="hidden" name="articleId" th:value="${article.id}">
                        <input type="hidden" name="parentId" value="0">
                        <div class="mb-2">
                            <textarea class="form-control" name="content" rows="3" maxlength="500" required
                                      placeholder="说点什么吧…"></textarea>
                        </div>
                        <button class="btn btn-primary btn-sm" type="submit">发表评论</button>
                    </form>
                    <div th:unless="${currentUserId != null}" class="alert alert-light border mb-4">
                        <a th:href="@{/login}">登录</a> 后可以发表评论。
                    </div>

                    <div th:if="${#lists.isEmpty(comments)}" class="text-muted small">还没有评论，来抢沙发。</div>

                    <div th:each="c : ${comments}" class="mb-4">
                        <div class="d-flex">
                            <div class="flex-grow-1">
                                <div class="small mb-1">
                                    <strong th:text="${c.authorName}"></strong>
                                    <span class="text-muted ms-2"
                                          th:text="${#temporals.format(c.createTime, 'yyyy-MM-dd HH:mm')}"></span>
                                </div>
                                <!-- 评论一律转义输出，不做 HTML 渲染 -->
                                <div th:text="${c.content}"></div>
                                <div class="small mt-1">
                                    <button type="button" class="btn btn-link btn-sm p-0 reply-btn"
                                            th:attr="data-parent=${c.id},data-name=${c.authorName}">回复
                                    </button>
                                    <form th:if="${isAdmin or c.userId == currentUserId}"
                                          th:action="@{'/comments/' + ${c.id} + '/delete'}" method="post"
                                          class="d-inline ms-2"
                                          onsubmit="return confirm('确定删除这条评论？');">
                                        <button class="btn btn-link btn-sm p-0 text-danger" type="submit">删除</button>
                                    </form>
                                </div>

                                <!-- 子回复（仅一层） -->
                                <div th:each="r : ${c.replies}" class="mt-3 ps-3 border-start">
                                    <div class="small mb-1">
                                        <strong th:text="${r.authorName}"></strong>
                                        <span th:if="${r.replyToName != null}">
                                            回复 <strong th:text="'@' + ${r.replyToName}"></strong>
                                        </span>
                                        <span class="text-muted ms-2"
                                              th:text="${#temporals.format(r.createTime, 'yyyy-MM-dd HH:mm')}"></span>
                                    </div>
                                    <div th:text="${r.content}"></div>
                                    <form th:if="${isAdmin or r.userId == currentUserId}"
                                          th:action="@{'/comments/' + ${r.id} + '/delete'}" method="post"
                                          class="d-inline"
                                          onsubmit="return confirm('确定删除这条评论？');">
                                        <button class="btn btn-link btn-sm p-0 text-danger" type="submit">删除</button>
                                    </form>
                                </div>

                                <!-- 回复框，默认隐藏 -->
                                <form th:if="${currentUserId != null}" th:action="@{/comments}" method="post"
                                      class="mt-2 d-none reply-form">
                                    <input type="hidden" name="articleId" th:value="${article.id}">
                                    <input type="hidden" name="parentId" th:value="${c.id}">
                                    <input type="hidden" name="replyToId" th:value="${c.id}">
                                    <div class="mb-2">
                                        <textarea class="form-control" name="content" rows="2" maxlength="500" required
                                                  th:attr="placeholder='回复 @' + ${c.authorName}"></textarea>
                                    </div>
                                    <button class="btn btn-primary btn-sm" type="submit">提交回复</button>
                                    <button class="btn btn-link btn-sm cancel-reply" type="button">取消</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // 回复框展开/收起，纯前端交互，不依赖任何框架
    document.querySelectorAll('.reply-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var wrap = btn.closest('.flex-grow-1');
            var form = wrap.querySelector('.reply-form');
            if (!form) return;
            var open = !form.classList.contains('d-none');
            document.querySelectorAll('.reply-form').forEach(function (f) { f.classList.add('d-none'); });
            form.classList.toggle('d-none', open);
            if (!open) form.querySelector('textarea').focus();
        });
    });
    document.querySelectorAll('.cancel-reply').forEach(function (btn) {
        btn.addEventListener('click', function () {
            btn.closest('.reply-form').classList.add('d-none');
        });
    });

    // 点赞 / 收藏：Ajax 调 /api/**，返回 JSON，符合「Ajax 不返回 HTML 片段」的架构纪律
    var articleId = [[${article.id}]];
    var csrfMeta = document.querySelector('meta[name="_csrf"]');
    var csrfHeader = document.querySelector('meta[name="_csrf_header"]');
    var csrfToken = csrfMeta ? csrfMeta.getAttribute('content') : null;
    var csrfHeaderName = csrfHeader ? csrfHeader.getAttribute('content') : null;

    function toggle(endpoint, btn, onClass, offClass) {
        if (btn.disabled) return;
        var headers = {'Content-Type': 'application/x-www-form-urlencoded'};
        if (csrfToken && csrfHeaderName) {
            headers[csrfHeaderName] = csrfToken;
        }
        fetch(endpoint, {
            method: 'POST',
            headers: headers,
            body: 'articleId=' + articleId
        }).then(function (r) {
            if (r.status === 401) { window.location.href = '/login'; return null; }
            return r.json();
        }).then(function (data) {
            if (!data || !data.success) return;
            var d = data.data;
            var active = endpoint.indexOf('like') >= 0 ? d.liked : d.favorited;
            btn.classList.toggle(onClass, active);
            btn.classList.toggle(offClass, !active);
            if (endpoint.indexOf('like') >= 0) {
                document.getElementById('likeCount').textContent = d.likeCount;
            }
        }).catch(function () {});
    }

    var likeBtn = document.getElementById('likeBtn');
    var favBtn = document.getElementById('favBtn');
    likeBtn.addEventListener('click', function () {
        toggle('/api/like/toggle', likeBtn, 'btn-danger', 'btn-outline-danger');
    });
    favBtn.addEventListener('click', function () {
        toggle('/api/favorite/toggle', favBtn, 'btn-warning', 'btn-outline-warning');
    });
</script>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
